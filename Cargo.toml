[package]
name = "planka-mcp"
version = "0.3.0"
edition = "2021"
description = "Model Context Protocol (MCP) server for Planka v2 kanban boards"
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/leofy-de/planka2-mcp"
homepage = "https://github.com/leofy-de/planka2-mcp"
documentation = "https://leofy-de.github.io/planka2-mcp/"
keywords = ["mcp", "planka", "kanban", "llm", "anthropic"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
